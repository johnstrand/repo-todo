name: Publish .NET tool

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RepoTodo.slnx

      - name: Build
        run: dotnet build RepoTodo.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RepoTodo.slnx --configuration Release --no-build

      - name: Pack
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet pack src/RepoTodo.csproj \
            --configuration Release \
            --no-build \
            --output artifacts \
            -p:PackageVersion="$version"

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
